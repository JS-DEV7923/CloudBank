services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudbank}
      POSTGRES_USER: ${POSTGRES_USER:-cloudbank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudbank}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudbank} -d ${POSTGRES_DB:-cloudbank}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cloudbank}
      DB_USERNAME: ${POSTGRES_USER:-cloudbank}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cloudbank}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
      JPA_DDL_AUTO: update
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  postgres-data:
